name: CI/CD Pipeline LaLiga

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Test Flask API
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laliga
          MYSQL_USER: laliga
          MYSQL_PASSWORD: laligapass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flask flask-sqlalchemy flask-jwt-extended flask-cors pymysql cryptography werkzeug

      - name: Start Flask Server
        run: |
          export DB_HOST=127.0.0.1
          export DB_USER=laliga
          export DB_PASS=laligapass
          export DB_NAME=laliga
          export DB_PORT=3306
          
          # Buscamos el archivo app.py y lo ejecutamos donde esté
          APP_PATH=$(find . -name "app.py" | head -n 1)
          echo "Ejecutando app desde: $APP_PATH"
          python $APP_PATH > server.log 2>&1 &
        env:
          SECRET_KEY: dev-secret-abc123
          JWT_SECRET_KEY: dev-jwt-xyz789

      - name: Wait for server to be ready
        run: |
          # Damos un margen para que MySQL y Flask arranquen
          timeout 60s bash -c 'until curl -s http://localhost:5001/api/health; do sleep 5; done' || (test -f server.log && cat server.log || echo "No se encontró server.log"; exit 1)

      - name: Integration Tests (CURL)
        run: |
          echo "1. Obteniendo Token..."
          TOKEN=$(curl --fail -s -X POST http://localhost:5001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username": "admin", "password": "Admin1234!"}' \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          
          if [ -z "$TOKEN" ]; then echo "Error obteniendo token"; exit 1; fi
          
          echo "2. Verificando API..."
          curl --fail -H "Authorization: Bearer $TOKEN" http://localhost:5001/api/teams
          
          echo "3. Test de creación..."
          TEAM_ID=$(curl --fail -s -X POST http://localhost:5001/api/teams \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"name": "CI Team", "city": "Github"}' \
            | grep -o '"id":[0-9]*' | cut -d':' -f2)
          
          echo "4. Limpieza..."
          curl --fail -X DELETE -H "Authorization: Bearer $TOKEN" http://localhost:5001/api/teams/$TEAM_ID

  test-frontend:
    name: Verify Frontend Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verificar archivos
        run: |
          # Buscamos el index.html por si no está en la raíz
          INDEX_PATH=$(find . -name "index.html" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then echo "index.html no encontrado"; exit 1; else echo "Encontrado en $INDEX_PATH"; fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy message
        run: echo "¡Todo correcto! Listo para desplegar."