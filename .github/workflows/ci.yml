name: CI/CD Pipeline LaLiga API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Test Flask API
    runs-on: ubuntu-latest

    services:
      # Levantamos MySQL para que Flask pueda conectarse durante los tests
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laliga
          MYSQL_USER: laliga
          MYSQL_PASSWORD: laligapass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-sqlalchemy flask-jwt-extended flask-cors pymysql cryptography werkzeug

      - name: Start Flask Server
        run: |
          # Usamos variables de entorno para que coincidan con el servicio de MySQL de arriba
          export DB_HOST=127.0.0.1
          export DB_USER=laliga
          export DB_PASS=laligapass
          export DB_NAME=laliga
          export DB_PORT=3306
          python app.py &
        env:
          SECRET_KEY: test-secret
          JWT_SECRET_KEY: test-jwt-secret

      - name: Wait for server to be ready
        run: |
          timeout 30s bash -c 'until curl -s http://localhost:5001/api/health; do sleep 2; done'

      # 1. Health Check
      - name: Health Check
        run: |
          curl --fail http://localhost:5001/api/health

      # 2. Login Admin y guardar token (Corregido: usa 'username' no 'email')
      - name: Login Admin
        run: |
          TOKEN=$(curl --fail -s -X POST http://localhost:5001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username": "admin", "password": "Admin1234!"}' \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          echo "API_TOKEN=$TOKEN" >> $GITHUB_ENV

      # 3. Listar Equipos
      - name: Listar Equipos
        run: |
          curl --fail http://localhost:5001/api/teams \
            -H "Authorization: Bearer ${{ env.API_TOKEN }}"

      # 4. Crear Equipo y guardar ID
      - name: Crear Equipo
        run: |
          TEAM_ID=$(curl --fail -s -X POST http://localhost:5001/api/teams \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ env.API_TOKEN }}" \
            -d '{"name": "Equipo Test CI", "city": "GitHub", "stadium": "Actions Arena"}' \
            | grep -o '"id":[0-9]*' | cut -d':' -f2)
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV

      # 5. Eliminar Equipo creado
      - name: Eliminar Equipo
        run: |
          curl --fail -X DELETE http://localhost:5001/api/teams/${{ env.TEAM_ID }} \
            -H "Authorization: Bearer ${{ env.API_TOKEN }}"

  test-frontend:
    name: Verify Frontend Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verificar archivos frontend
        run: |
          test -f ./frontend/index.html && echo "index.html encontrado" || (echo "Error: index.html no existe" && exit 1)

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy message
        run: echo "Desplegando a producción la versión de LaLiga API..."