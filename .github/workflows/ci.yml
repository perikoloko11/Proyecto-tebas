name: CI/CD Pipeline LaLiga

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Test Flask API
    runs-on: ubuntu-latest

    services:
      # Levantamos MySQL con las credenciales que usa tu app.py por defecto
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laliga
          MYSQL_USER: laliga
          MYSQL_PASSWORD: laligapass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flask flask-sqlalchemy flask-jwt-extended flask-cors pymysql cryptography werkzeug

      - name: Start Flask Server
        run: |
          # Configuramos las variables de entorno para que Flask encuentre la DB
          export DB_HOST=127.0.0.1
          export DB_USER=laliga
          export DB_PASS=laligapass
          export DB_NAME=laliga
          export DB_PORT=3306
          # Ejecutamos en segundo plano y guardamos logs para debug
          python app.py > server.log 2>&1 & 
        env:
          SECRET_KEY: dev-secret-abc123
          JWT_SECRET_KEY: dev-jwt-xyz789

      - name: Wait for server to be ready
        run: |
          # Espera hasta 60 segundos a que el endpoint /api/health responda 200 OK
          # Si falla, hace un "cat" del log para que veas el error de Python
          timeout 60s bash -c 'until curl -s http://localhost:5001/api/health; do sleep 5; done' || (cat server.log && exit 1)

      - name: Integration Tests (CURL)
        run: |
          echo "1. Obteniendo Token de Admin..."
          TOKEN=$(curl --fail -s -X POST http://localhost:5001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username": "admin", "password": "Admin1234!"}' \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          
          if [ -z "$TOKEN" ]; then echo "Error: No se obtuvo el token"; exit 1; fi
          
          echo "2. Verificando lista de equipos..."
          curl --fail -H "Authorization: Bearer $TOKEN" http://localhost:5001/api/teams
          
          echo "3. Creando equipo de prueba..."
          TEAM_ID=$(curl --fail -s -X POST http://localhost:5001/api/teams \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"name": "CI Test Team", "city": "Github", "stadium": "Actions Arena"}' \
            | grep -o '"id":[0-9]*' | cut -d':' -f2)
          
          echo "4. Eliminando equipo creado (ID: $TEAM_ID)..."
          curl --fail -X DELETE -H "Authorization: Bearer $TOKEN" http://localhost:5001/api/teams/$TEAM_ID

  test-frontend:
    name: Verify Frontend Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verificar archivos
        run: |
          # Verifica que la carpeta frontend y el index existen
          ls -R ./frontend
          test -f ./frontend/index.html

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy message
        run: echo "Despliegue simulado completado con éxito."